<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadilah Bintang UCIC!</title>
    <!-- FIX: Menghilangkan error 404 favicon di halaman upload -->
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-950 text-white flex flex-col items-center justify-center min-h-screen p-4">
    <div class="bg-blue-900 p-6 rounded-3xl shadow-2xl w-full max-w-sm text-center border border-blue-700">
        <h1 class="text-2xl font-extrabold mb-2 uppercase italic text-yellow-400">Tampil di Stage!</h1>
        <p class="text-sm mb-6 text-gray-300">Ambil selfie terbaikmu. AI kami akan memakaikan Jas Almamater UCIC dan menayangkannya di layar utama!</p>

        <input type="file" id="fotoInput" accept="image/*" capture="user" class="hidden">
        <label for="fotoInput" id="btnUpload" class="bg-gradient-to-r from-blue-500 to-blue-700 hover:from-blue-400 text-white font-bold py-4 px-6 rounded-full cursor-pointer flex justify-center items-center w-full mb-4 shadow-lg transition-transform transform hover:scale-105">
        Buka Kamera
        </label>

        <div id="loading" class="hidden mt-6 mb-4">
            <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-yellow-400 mx-auto"></div>
            <p class="text-xs mt-3 text-yellow-300 font-bold animate-pulse">🤖 AI sedang memproses Jas Almamater UCIC & menghapus background (10-20 detik)...</p>
        </div>
    </div>

    <script>
        const fotoInput = document.getElementById('fotoInput');
        const loading = document.getElementById('loading');
        const btnUpload = document.getElementById('btnUpload');

        fotoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            btnUpload.classList.add('hidden');
            loading.classList.remove('hidden');

            const img = new Image();
            const url = URL.createObjectURL(file);
            
            img.onload = function() {
                URL.revokeObjectURL(url);
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Ukuran 1024x1024 persegi agar sesuai standar terbaik OpenAI Image Edit
                const SIZE = 1024;
                canvas.width = SIZE;
                canvas.height = SIZE;
                
                // Crop tengah secara proporsional (Square)
                const minSide = Math.min(img.width, img.height);
                const sx = (img.width - minSide) / 2;
                const sy = (img.height - minSide) / 2;
                ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, SIZE, SIZE);

                // Kirim langsung dalam format PNG
                canvas.toBlob((blob) => {
                    const formData = new FormData();
                    formData.append("foto_audiens", blob, "image.png");

                    fetch('upload.php', {
                        method: 'POST',
                        body: formData
                    })
                    .then(async response => {
                        const text = await response.text();
                        try {
                            return JSON.parse(text);
                        } catch (err) {
                            throw new Error("Respon server: " + text);
                        }
                    })
                    .then(data => {
                        console.log("Hasil Server:", data);
                        if (data.status === "success") {
                            document.body.innerHTML = `
                                <div class="text-center p-6 flex flex-col justify-center items-center h-screen bg-blue-950">
                                    <h1 class="text-5xl font-black mb-4 text-green-400 drop-shadow-md">Berhasil!</h1>
                                    <p class="text-lg font-medium text-gray-200 mt-2">Lihat layar Stage sekarang!</p>
                                </div>
                            `;
                        } else {
                            alert("Ditolak Server: " + data.message);
                            resetUI();
                        }
                    })
                    .catch(err => {
                        alert("Gagal upload foto: " + err.message);
                        resetUI();
                    });
                }, 'image/png');
            };
            img.src = url;
        });

        function resetUI() {
            loading.classList.add('hidden');
            btnUpload.classList.remove('hidden');
        }
    </script>
</body>
</html>
