<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCIC DOOH Display Stage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { ucicBlue: '#00539C', ucicDark: '#012A54', ucicYellow: '#FFD100' } } }
        }
    </script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #ffffff; }
        .layar { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; transition: opacity 1s ease-in-out; }
        .hidden-fade { opacity: 0; pointer-events: none; z-index: 0; }
        .active-fade { opacity: 1; z-index: 10; }
        
        .qr-box { 
            position: absolute; bottom: 8%; right: 4%; width: 200px; 
            background: rgba(0, 83, 156, 0.9); backdrop-filter: blur(10px);
            padding: 15px; border-radius: 12px; border: 2px solid #FFD100; box-shadow: 0 10px 30px rgba(0, 83, 156, 0.3); z-index: 40;
        }
        .mask-edges {
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
        }

        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 10s infinite alternate; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
    </style>
</head>
<body class="bg-white text-gray-800">

    <!-- BACKGROUND BLOBS -->
    <div class="fixed inset-0 w-full h-full z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-[40vw] h-[40vw] bg-ucicBlue rounded-full mix-blend-multiply filter blur-[120px] opacity-40 animate-blob"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-ucicDark rounded-full mix-blend-multiply filter blur-[140px] opacity-30 animate-blob animation-delay-2000"></div>
        <div class="absolute top-[20%] left-[30%] w-[30vw] h-[30vw] bg-ucicYellow rounded-full mix-blend-multiply filter blur-[100px] opacity-20 animate-blob animation-delay-4000"></div>
    </div>

    <!-- ================= PAGE 1 ================= -->
    <div id="page1" class="layar active-fade relative bg-transparent">
        <div class="absolute top-8 left-10 lg:left-16 z-50">
            <img src="/logo.png" alt="Logo UCIC" class="h-16 lg:h-20 object-contain">
        </div>

        <div class="absolute top-[25%] left-10 lg:left-16 z-30 w-[50%] lg:w-[45%] pr-4">
            <h2 class="text-3xl lg:text-4xl font-extrabold text-ucicBlue tracking-widest mb-2 uppercase drop-shadow-sm">UCIC GREAT!</h2>
            <h1 class="text-5xl lg:text-[4.5rem] xl:text-[5rem] font-black italic text-ucicDark leading-tight mb-4 tracking-tight drop-shadow-sm">#KampusTeknologiAI</h1>
            <p class="text-xl lg:text-2xl text-gray-700 font-bold mt-4 bg-white/60 backdrop-blur-sm inline-block px-5 py-2 rounded-xl border border-white/50 shadow-sm">
                TUNGGU APA LAGI? TAMPILKAN WAJAHMU!
            </p>
            
            <p id="ai-status" class="mt-6 text-xl font-bold text-ucicBlue animate-pulse bg-ucicYellow/90 inline-block px-4 py-2 rounded-lg hidden shadow-md">
                🤖 AI UCIC sedang memotong foto...
            </p>
        </div>
        
        <img src="/model-default.png" class="absolute bottom-0 right-[2%] lg:right-[5%] max-w-[50vw] h-[85vh] object-contain object-bottom z-10 mask-edges drop-shadow-[0_20px_50px_rgba(0,83,156,0.3)]" alt="Model Default">
        
        <div class="qr-box text-white text-center flex flex-col items-center">
            <!-- GANTI URL LOCALTUNNEL JIKA MATI -->
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://hip-heads-like.loca.lt/upload.html" alt="QR" class="rounded bg-white p-1 w-full">
            <p class="text-xs font-bold mt-3 uppercase tracking-wider text-ucicYellow">Scan & Upload Foto<br><span class="text-white text-[10px]">Biar Tampil Di Sini!</span></p>
        </div>
    </div>

    <!-- ================= PAGE 2 ================= -->
    <div id="page2" class="layar hidden-fade relative bg-transparent">
        <div class="absolute top-8 left-10 lg:left-16 z-50">
            <img src="/logo.png" alt="Logo UCIC" class="h-16 lg:h-20 object-contain">
        </div>

        <div class="absolute top-[25%] left-10 lg:left-16 z-30 w-[50%] lg:w-[45%] pr-4">
            <h2 class="text-3xl lg:text-4xl font-extrabold text-ucicBlue tracking-widest mb-2 uppercase drop-shadow-sm">UCIC GREAT!</h2>
            <h1 class="text-5xl lg:text-[4.5rem] xl:text-[5rem] font-black italic text-ucicDark leading-tight mb-4 tracking-tight drop-shadow-sm">#KampusTeknologiAI</h1>
            <p class="text-xl lg:text-2xl text-ucicBlue font-black mt-4 animate-pulse bg-ucicYellow/90 inline-block px-6 py-2 rounded-full shadow-lg border border-ucicYellow">
                GILIRANMU BERSINAR!
            </p>
        </div>
        
        <img id="ugc-image" src="" alt="Audiens" class="absolute bottom-0 right-[2%] lg:right-[5%] max-w-[50vw] h-[85vh] object-contain object-bottom z-10 mask-edges drop-shadow-[0_20px_50px_rgba(0,83,156,0.3)]" onerror="this.style.display='none'" onload="this.style.display='block'">

        <div class="qr-box text-white text-center flex flex-col items-center">
            <!-- GANTI URL LOCALTUNNEL JIKA MATI -->
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://hip-heads-like.loca.lt/upload.html" alt="QR" class="rounded bg-white p-1 w-full">
            <p class="text-xs font-bold mt-3 uppercase tracking-wider text-ucicYellow">GILIRANMU!<br><span class="text-white text-[10px]">SCAN SEKARANG</span></p>
        </div>
    </div>

    <!-- SCRIPT 1: LOGIKA UI UTAMA (Berjalan Independen Tanpa Tertahan AI) -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');
        
        // Simpan ke window agar bisa diakses oleh Script AI di bawah
        window.ugcImage = document.getElementById('ugc-image');
        window.aiStatus = document.getElementById('ai-status');
        
        let currentState = 1;
        let loopInterval;

        window.showPage = function(pageNumber) {
            if (pageNumber === 1) {
                page1.classList.replace('hidden-fade', 'active-fade');
                page2.classList.replace('active-fade', 'hidden-fade');
                currentState = 1;
            } else {
                page2.classList.replace('hidden-fade', 'active-fade');
                page1.classList.replace('active-fade', 'hidden-fade');
                currentState = 2;
            }
        }

        window.startLoop = function() {
            if (loopInterval) clearInterval(loopInterval); 
            loopInterval = setInterval(() => {
                if (currentState === 1) { window.showPage(2); } else { window.showPage(1); }
            }, 5000); 
        }

        // Langsung mulai loop sejak layar dinyalakan!
        window.startLoop();
    </script>

    <!-- SCRIPT 2: MODULE AI (Terpisah agar tidak merusak putaran UI jika koneksi lambat) -->
    <script type="module">
        import imglyRemoveBackground from "https://unpkg.com/@imgly/background-removal@1.4.3/dist/index.mjs";

        socket.on('proses_ai_di_laptop', async (data) => {
            console.log("Menerima gambar kecil, memulai proses AI...");
            
            window.showPage(1); 
            window.aiStatus.style.display = 'inline-block';

            try {
                const config = { publicPath: "https://unpkg.com/@imgly/background-removal@1.4.3/dist/" };
                
                // Ubah base64 yang sudah dikompres menjadi blob
                const res = await fetch(data.image);
                const blob = await res.blob();

                // Proses AI
                const processedBlob = await imglyRemoveBackground(blob, config);
                const url = URL.createObjectURL(processedBlob);

                // Tampilkan hasil, pindah ke Halaman 2, reset putaran waktu 5 detik
                window.ugcImage.src = url;
                window.aiStatus.style.display = 'none';
                window.showPage(2); 
                window.startLoop(); 
                
            } catch (error) {
                console.error("AI Error:", error);
                window.aiStatus.innerText = "❌ Proses gagal. Mengulangi layar...";
                setTimeout(() => { window.aiStatus.style.display = 'none'; window.startLoop(); }, 3000);
            }
        });
    </script>
</body>
</html>
