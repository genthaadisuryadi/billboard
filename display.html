<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCIC DOOH Display Stage</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        ucicBlue: '#00539C', 
                        ucicDark: '#012A54', 
                        ucicYellow: '#FFD100' 
                    } 
                } 
            } 
        }
    </script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #ffffff; }
        
        .layar { 
            width: 100vw; 
            height: 100vh; 
            position: fixed !important; 
            top: 0 !important; 
            left: 0 !important; 
            transition: opacity 0.8s ease-in-out; 
        }
        .hidden-fade { opacity: 0; pointer-events: none; z-index: 0; }
        .active-fade { opacity: 1; z-index: 10; }
        
        .qr-box { 
            position: absolute; bottom: 8%; right: 4%; width: 200px; 
            background: rgba(0, 83, 156, 0.9); backdrop-filter: blur(10px);
            padding: 15px; border-radius: 12px; border: 2px solid #FFD100; 
            box-shadow: 0 10px 30px rgba(0, 83, 156, 0.3); z-index: 40;
        }
        
        .mask-edges {
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 12%, black 88%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0%, black 12%, black 88%, transparent 100%);
        }

        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 10s infinite alternate; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
    </style>
</head>
<body class="bg-white text-gray-800">

    <!-- BACKGROUND ANIMATION -->
    <div class="fixed inset-0 w-full h-full z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-[40vw] h-[40vw] bg-ucicBlue rounded-full mix-blend-multiply filter blur-[120px] opacity-40 animate-blob"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-ucicDark rounded-full mix-blend-multiply filter blur-[140px] opacity-30 animate-blob animation-delay-2000"></div>
        <div class="absolute top-[20%] left-[30%] w-[30vw] h-[30vw] bg-ucicYellow rounded-full mix-blend-multiply filter blur-[100px] opacity-20 animate-blob animation-delay-4000"></div>
    </div>

    <!-- PAGE 1: TAMPILAN DEFAULT (DENGAN QR CODE) -->
    <div id="page1" class="layar active-fade bg-transparent">
        <div class="absolute top-8 left-10 lg:left-16 z-50">
            <img src="logo.png" alt="Logo UCIC" class="h-16 lg:h-20 object-contain">
        </div>
        <div class="absolute top-[25%] left-10 lg:left-16 z-30 w-[50%] lg:w-[45%] pr-4">
            <h2 class="text-3xl lg:text-4xl font-extrabold text-ucicBlue tracking-widest mb-2 uppercase drop-shadow-sm">UCIC GREAT!</h2>
            <h1 class="text-5xl lg:text-[4.5rem] xl:text-[5rem] font-black italic text-ucicDark leading-tight mb-4 tracking-tight drop-shadow-sm">#KampusTeknologiAI</h1>
            <p class="text-xl lg:text-2xl text-gray-700 font-bold mt-4 bg-white/60 backdrop-blur-sm inline-block px-5 py-2 rounded-xl border border-white/50 shadow-sm">
                TUNGGU APA LAGI? TAMPILKAN WAJAHMU!
            </p>
        </div>
        <img src="model-default.png" class="absolute bottom-0 right-[2%] lg:right-[5%] max-w-[50vw] h-[85vh] object-contain object-bottom z-10 mask-edges drop-shadow-[0_20px_50px_rgba(0,83,156,0.3)]" alt="Model Default">
        
        <div class="qr-box text-white text-center flex flex-col items-center">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://billboard.agenticaicenter.id/upload.html" alt="QR" class="rounded bg-white p-1 w-full">
            <p class="text-xs font-bold mt-3 uppercase tracking-wider text-ucicYellow">Scan & Upload Foto<br><span class="text-white text-[10px]">Biar Tampil Di Sini!</span></p>
        </div>
    </div>

    <!-- PAGE 2: HASIL AUDIENS (TANPA QR CODE & TANPA KOTAK BACKGROUND) -->
    <div id="page2" class="layar hidden-fade bg-transparent">
        <div class="absolute top-8 left-10 lg:left-16 z-50">
            <img src="logo.png" alt="Logo UCIC" class="h-16 lg:h-20 object-contain">
        </div>
        <div class="absolute top-[25%] left-10 lg:left-16 z-30 w-[50%] lg:w-[45%] pr-4">
            <h2 class="text-3xl lg:text-4xl font-extrabold text-ucicBlue tracking-widest mb-2 uppercase drop-shadow-sm">UCIC GREAT!</h2>
            <h1 class="text-5xl lg:text-[4.5rem] xl:text-[5rem] font-black italic text-ucicDark leading-tight mb-4 tracking-tight drop-shadow-sm">#KampusTeknologiAI</h1>
            <p class="text-xl lg:text-2xl text-ucicBlue font-black mt-4 animate-pulse bg-ucicYellow/90 inline-block px-6 py-2 rounded-full shadow-lg border border-ucicYellow">
                GILIRANMU BERSINAR!
            </p>
        </div>
        
        <!-- FOTO HASIL AUDIENS -->
        <img id="ugc-image" src="model-default.png" alt="Foto Audiens" class="absolute bottom-0 right-[5%] lg:right-[8%] max-w-[50vw] h-[88vh] object-contain object-bottom z-10 drop-shadow-[0_20px_50px_rgba(0,83,156,0.35)]">
    </div>

    <!-- SCRIPT MURNI (TANPA LIBRARY EKSTERNAL YANG BISA ERROR) -->
    <script>
        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');
        const ugcImage = document.getElementById('ugc-image');
        
        let currentState = 1;
        let loopInterval;
        let lastStatus = "";

        function showPage(pageNumber) {
            if (pageNumber === 1) {
                page1.classList.replace('hidden-fade', 'active-fade');
                page2.classList.replace('active-fade', 'hidden-fade');
                currentState = 1;
            } else {
                page2.classList.replace('hidden-fade', 'active-fade');
                page1.classList.replace('active-fade', 'hidden-fade');
                currentState = 2;
            }
        }

        function startLoop() {
            if (loopInterval) clearInterval(loopInterval); 
            loopInterval = setInterval(() => {
                if (currentState === 1) showPage(2); 
                else showPage(1);
            }, 6000); 
        }

        // Fungsi Canvas Flood-Fill: Menghapus background putih dari tepi luar menjadi transparan
        // tanpa menghapus kemeja putih di bagian dalam jas almamater biru dongker
        function hapusBackgroundPutih(imgUrl, callback) {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = function() {
                try {
                    const canvas = document.createElement('canvas');
                    const w = img.width;
                    const h = img.height;
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    const imgData = ctx.getImageData(0, 0, w, h);
                    const data = imgData.data;
                    const visited = new Uint8Array(w * h);
                    const queue = [];

                    // Cek apakah piksel berwarna putih/terang (background studio AI)
                    function isBgLight(idx) {
                        const r = data[idx], g = data[idx + 1], b = data[idx + 2], a = data[idx + 3];
                        if (a < 20) return true;
                        return (r > 228 && g > 228 && b > 228 && Math.abs(r - g) < 18 && Math.abs(g - b) < 18);
                    }

                    // Mulai telusuri hanya dari tepi ATAS, KIRI, dan KANAN (agar kemeja dalam tetap aman)
                    for (let x = 0; x < w; x++) {
                        queue.push(x); // Tepi atas
                        visited[x] = 1;
                    }
                    for (let y = 0; y < h; y++) {
                        let leftIdx = y * w;
                        let rightIdx = y * w + (w - 1);
                        if (!visited[leftIdx]) { queue.push(leftIdx); visited[leftIdx] = 1; }
                        if (!visited[rightIdx]) { queue.push(rightIdx); visited[rightIdx] = 1; }
                    }

                    let head = 0;
                    while (head < queue.length) {
                        const pos = queue[head++];
                        const pIdx = pos * 4;

                        if (isBgLight(pIdx)) {
                            data[pIdx + 3] = 0; // Jadikan 100% Transparan
                            const x = pos % w;
                            const y = (pos - x) / w;

                            if (x > 0 && !visited[pos - 1]) { visited[pos - 1] = 1; queue.push(pos - 1); }
                            if (x < w - 1 && !visited[pos + 1]) { visited[pos + 1] = 1; queue.push(pos + 1); }
                            if (y > 0 && !visited[pos - w]) { visited[pos - w] = 1; queue.push(pos - w); }
                            if (y < h - 1 && !visited[pos + w]) { visited[pos + w] = 1; queue.push(pos + w); }
                        }
                    }

                    ctx.putImageData(imgData, 0, 0);
                    ugcImage.src = canvas.toDataURL('image/png');
                } catch (e) {
                    ugcImage.src = imgUrl;
                }
                if (callback) callback();
            };
            img.onerror = function() {
                ugcImage.src = imgUrl;
                if (callback) callback();
            };
            img.src = imgUrl;
        }

        // Cek file status.txt setiap 2 detik
        setInterval(async () => {
            try {
                const res = await fetch('status.txt?t=' + new Date().getTime());
                const currentStatus = (await res.text()).trim();

                if (lastStatus === "" && currentStatus !== "") {
                    lastStatus = currentStatus;
                    hapusBackgroundPutih('uploads/hasil.jpg?t=' + currentStatus);
                } else if (currentStatus !== lastStatus && currentStatus !== "") {
                    lastStatus = currentStatus;
                    console.log("Foto baru selesai diproses! Menampilkan ke Halaman 2...");
                    hapusBackgroundPutih('uploads/hasil.jpg?t=' + currentStatus, () => {
                        if (loopInterval) clearInterval(loopInterval);
                        showPage(2);
                        startLoop();
                    });
                }
            } catch (e) {
                console.log("Menunggu sinyal status...");
            }
        }, 2000);

        startLoop();
    </script>
</body>
</html>
